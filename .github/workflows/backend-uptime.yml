name: backend-uptime

# The Fly backend (admin, CRM, lead forms, Telegram → blog) once went unreachable for two weeks
# without anyone noticing. This pings /health every hour; a failed run makes GitHub email the
# repo's workflow owner (Settings → Notifications → Actions), so an outage is seen the same day.
# The Fly app status itself (stopped machine, billing) still needs `flyctl status` — docs/20 §7.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: api.sof-expo.com/health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 15 https://api.sof-expo.com/health; then exit 0; fi
            sleep 20
          done
          echo "::error::https://api.sof-expo.com/health is not answering — run flyctl status --app sofexpo-api (docs/20 §7)"
          exit 1
