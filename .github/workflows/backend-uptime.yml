name: backend-uptime

# The backend (admin, CRM, lead forms, Telegram → blog) once went unreachable for two weeks
# without anyone noticing. This pings /health every hour; a failed run makes GitHub email the
# repo's workflow owner (Settings → Notifications → Actions), so an outage is seen the same day.
# The backend runs on Hetzner via Coolify — check the Coolify resource's status/logs there if
# this goes red (docs/25 §7); it is no longer on Fly.io.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: api.sof-expo.com/health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 15 https://api.sof-expo.com/health; then exit 0; fi
            sleep 20
          done
          echo "::error::https://api.sof-expo.com/health is not answering — check the Coolify resource's status/logs (docs/25 §7)"
          exit 1
