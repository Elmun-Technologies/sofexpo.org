# Coolify deployment of the backend on the Hetzner server (docs/25-hetzner-coolify-deploy.md).
# This is how the backend runs on Hetzner, deployed by Coolify's "Docker Compose" resource.
# It is NOT used by `docker compose up` on a laptop: it has no bind mounts for local dev
# (use `npm run lead-webhook` for that, docs/17).
#
# Env vars: set every value below as a Coolify "Environment Variable" on this resource —
# never commit real values here. The required/optional split and names match docs/25 §2
# exactly.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Coolify's own reverse proxy (Traefik) terminates TLS and forwards to this port;
      # exposing it here lets Coolify's proxy reach the container without extra labels.
      - target: 8787
        published: 8787
        protocol: tcp
    volumes:
      # Everything stateful lives under /data: the SQLite db (WAL mode) and, next to it,
      # exhibitor uploads (server.mjs defaults UPLOADS_DIR to <dirname of LEAD_WEBHOOK_DB>/uploads
      # when UPLOADS_DIR is unset) — one volume covers both.
      - sofexpo_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      NODE_ENV: production
      LEAD_WEBHOOK_HOST: "0.0.0.0"
      LEAD_WEBHOOK_PORT: "8787"
      LEAD_WEBHOOK_DB: /data/sofexpo.sqlite
      LEAD_WEBHOOK_TRUST_PROXY: "1" # Coolify's Traefik is the trusted reverse proxy in front of this container
      LEAD_WEBHOOK_ORIGINS: "https://sof-expo.com,https://www.sof-expo.com,https://foodera.sof-expo.com,https://buildpro.sof-expo.com,https://agropro.sof-expo.com,https://worldedu.sof-expo.com,https://ecomretail.sof-expo.com,https://api.sof-expo.com"
      ADMIN_SESSION_DAYS: "7"
      PORTAL_SESSION_DAYS: "14"
      # --- required secrets (Coolify "Environment Variable", marked secret) ---
      # the `:?` form fails the deploy loudly if Coolify is missing one, instead of silently
      # booting with an empty admin password or webhook secret
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in Coolify}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in Coolify}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in Coolify}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set TELEGRAM_WEBHOOK_SECRET in Coolify}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:?set TELEGRAM_CHANNEL_ID in Coolify}
      # required because BLOG_SYNC_GIT_PUSH=1 below — docker-start.sh enforces this at
      # container start too, but failing here is faster (before even building the image)
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN in Coolify (BLOG_SYNC_GIT_PUSH=1 needs it)}
      # --- optional secrets (leave unset in Coolify to disable the feature) ---
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      CRM_WEBHOOK_URL: ${CRM_WEBHOOK_URL:-}
      CRM_WEBHOOK_TOKEN: ${CRM_WEBHOOK_TOKEN:-}
      LEAD_WEBHOOK_SECRET: ${LEAD_WEBHOOK_SECRET:-}
      LEAD_WEBHOOK_STATS_TOKEN: ${LEAD_WEBHOOK_STATS_TOKEN:-}
      # --- Telegram -> blog sync (docs/telegram-blog-sync.md) ---
      BLOG_SYNC_ENABLED: "1"
      BLOG_SYNC_MODE: auto
      BLOG_SYNC_COLLECTION: news
      BLOG_SYNC_LOCALE: ru
      BLOG_SYNC_MAX_FILE_MB: "20"
      BLOG_SYNC_REPO_DIR: /app
      # SQLite is single-writer: never run a second backend instance pushing to `main` at the
      # same time as this one, or blog posts and admin/CRM data can fork (docs/25 §4).
      BLOG_SYNC_GIT_PUSH: "1"
      BLOG_SYNC_GIT_REMOTE: origin
      BLOG_SYNC_GIT_BRANCH: main
      BLOG_SYNC_PUSH_DEBOUNCE_MS: "20000"
      TELEGRAM_CHANNEL_USERNAME: sofexpo
      TELEGRAM_WEBHOOK_URL: https://api.sof-expo.com/api/telegram/webhook

volumes:
  sofexpo_data:
