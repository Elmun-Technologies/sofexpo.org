app = "sofexpo-api"
primary_region = "ist"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  LEAD_WEBHOOK_HOST = "0.0.0.0"
  LEAD_WEBHOOK_PORT = "8787"
  LEAD_WEBHOOK_DB = "/data/sofexpo.sqlite"
  LEAD_WEBHOOK_TRUST_PROXY = "1"
  LEAD_WEBHOOK_ORIGINS = "https://sof-expo.com,https://foodera.sof-expo.com,https://buildpro.sof-expo.com,https://agropro.sof-expo.com,https://worldedu.sof-expo.com,https://ecomretail.sof-expo.com,https://api.sof-expo.com"
  ADMIN_SESSION_DAYS = "7"
  PORTAL_SESSION_DAYS = "14"
  BLOG_SYNC_ENABLED = "1"
  BLOG_SYNC_MODE = "auto"
  BLOG_SYNC_COLLECTION = "news"
  BLOG_SYNC_LOCALE = "ru"
  BLOG_SYNC_MAX_FILE_MB = "20"
  BLOG_SYNC_REPO_DIR = "/app"
  BLOG_SYNC_GIT_PUSH = "1"
  BLOG_SYNC_GIT_REMOTE = "origin"
  BLOG_SYNC_GIT_BRANCH = "main"
  BLOG_SYNC_PUSH_DEBOUNCE_MS = "20000"
  TELEGRAM_CHANNEL_USERNAME = "sofexpo"
  TELEGRAM_WEBHOOK_URL = "https://api.sof-expo.com/api/telegram/webhook"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

[[mounts]]
  source = "sofexpo_data"
  destination = "/data"
  snapshot_retention = 7

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
